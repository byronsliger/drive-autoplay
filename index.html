<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#425992" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A2C" media="(prefers-color-scheme: dark)">
<title>Drive Autoplay</title>
<meta name="description" content="Reproduce carpetas públicas de Google Drive con autoplay, velocidad guardada, capítulos vistos y progreso por capítulo.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Installed app: standalone window on Android (Chrome) and iOS (Safari "Add to Home Screen"). -->
<meta name="application-name" content="Drive Autoplay">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Autoplay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { const t = JSON.parse(localStorage.getItem("theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #DBE2E6;
    --surface: #F2F5F7;
    --fg: #1B2540;
    --mut: #4A566E;
    --line: #BFCBD3;
    --acc: #425992;
    --onacc: #F2F5F7;
    --acc-fg: #34487C;
    --acc-soft: #C3DBE2;
    --ok: #2F7A5B;
    --err: oklch(48% 0.17 28);
    --media: #101728;
    --shadow: 0 1px 2px rgb(27 37 64 / .08), 0 8px 24px -12px rgb(27 37 64 / .25);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root[data-theme="dark"] {
    --bg: #131A2C;
    --surface: #1A233A;
    --fg: #DBE2E6;
    --mut: #909BAE;
    --line: #2D3955;
    --acc: #5F89BB;
    --onacc: #0E1424;
    --acc-fg: #B2D4DC;
    --acc-soft: #243255;
    --ok: #6CC49B;
    --err: oklch(75% 0.13 25);
    --media: #0A0F1C;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131A2C;
      --surface: #1A233A;
      --fg: #DBE2E6;
      --mut: #909BAE;
      --line: #2D3955;
      --acc: #5F89BB;
      --onacc: #0E1424;
      --acc-fg: #B2D4DC;
      --acc-soft: #243255;
      --ok: #6CC49B;
      --err: oklch(75% 0.13 25);
      --media: #0A0F1C;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .5);
    }
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 20px 16px 48px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 "Figtree", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--acc); color: var(--onacc); }
  main { max-width: 720px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font: 600 1.5rem/1.2 "Fraunces", Georgia, serif; letter-spacing: -0.01em; margin: 0; }
  .tools { display: flex; gap: 8px; }
  .lede { margin: -8px 0 20px; max-width: 60ch; color: var(--mut); text-wrap: pretty; }

  button, select, input { font: inherit; color: var(--fg); }
  button, select { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ghost {
    display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0;
    background: transparent; border: 1px solid var(--line); border-radius: 12px;
    transition: background-color .15s, border-color .15s;
  }
  .ghost:hover:not(:disabled) { background: var(--acc-soft); border-color: var(--acc); }
  .ghost:disabled { opacity: .4; cursor: default; }
  .ghost.seek { display: inline-flex; align-items: center; gap: 4px; width: auto; padding: 0 12px; font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .ghost.seek .icon { width: 18px; height: 18px; }
  #theme .sun { display: none; }
  #theme[data-mode="dark"] .sun { display: block; }
  #theme[data-mode="dark"] .moon { display: none; }

  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; height: 48px; padding: 0 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  input::placeholder { color: var(--mut); opacity: 1; }
  input:focus-visible { outline-offset: 0; border-color: var(--acc); }
  .primary {
    height: 48px; padding: 0 20px; font-weight: 600;
    background: var(--acc); color: var(--onacc); border: 0; border-radius: 12px;
    transition: filter .15s, transform .15s;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { opacity: .6; cursor: default; }

  #msg { margin: 12px 2px 0; color: var(--mut); font-size: .9rem; min-height: 1.35em; }
  #msg.err { color: var(--err); }

  #app { margin-top: 20px; }
  .stage {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px; box-shadow: var(--shadow);
  }
  .media { border-radius: 10px; overflow: hidden; background: var(--media); }
  #player { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 60vh; background: transparent; }
  #player.audio { aspect-ratio: auto; height: 54px; }
  .media.has-bg #player.audio { aspect-ratio: 16 / 9; height: auto; max-height: 60vh; object-fit: cover; }

  .now { display: flex; align-items: center; gap: 12px; padding: 14px 4px 4px; flex-wrap: wrap; }
  .meta { flex: 1 1 200px; min-width: 0; }
  .title { font: 500 1.15rem/1.3 "Fraunces", Georgia, serif; margin: 0; overflow-wrap: anywhere; }
  .count { color: var(--mut); font-size: .875rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .speed { position: relative; display: inline-flex; align-items: center; }
  .speed select {
    appearance: none; height: 44px; padding: 0 34px 0 14px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    background: transparent; border: 1px solid var(--line); border-radius: 12px;
  }
  .speed select:hover { border-color: var(--acc); background: var(--acc-soft); }
  .speed .icon { position: absolute; right: 10px; width: 16px; height: 16px; pointer-events: none; color: var(--mut); }
  select option { background: var(--surface); color: var(--fg); }

  ol {
    list-style: none; margin: 16px 0 0; padding: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    max-height: 50vh; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  li { display: flex; align-items: center; gap: 4px; border-radius: 10px; transition: background-color .15s; }
  li:hover, li.current { background: var(--acc-soft); }
  .track {
    display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; min-height: 52px; padding: 8px 12px;
    background: transparent; border: 0; border-radius: 10px; text-align: left;
  }
  li.current .track { color: var(--acc-fg); font-weight: 600; }
  .num { width: 2ch; min-width: 24px; text-align: right; color: var(--mut); font-size: .85rem; font-variant-numeric: tabular-nums; }
  li.current .num { color: var(--acc-fg); }
  .info { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.done:not(.current) .name { color: var(--mut); }
  .bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--acc); }
  li.done .bar i { background: var(--ok); }
  .size { color: var(--mut); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mark {
    display: inline-grid; place-items: center; width: 40px; height: 40px; margin-right: 6px; padding: 0; flex: none;
    background: transparent; border: 1px solid transparent; border-radius: 50%; color: var(--line);
    transition: color .15s, border-color .15s;
  }
  .mark:hover { color: var(--mut); border-color: var(--line); }
  li.done .mark { color: var(--ok); }
  .upto {
    display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0; flex: none;
    background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--mut);
    transition: color .15s, border-color .15s, opacity .15s;
  }
  .upto:hover { color: var(--ok); border-color: var(--line); }
  .upto .icon { width: 18px; height: 18px; }
  /* On pointer devices the bulk action only shows on the hovered or focused row. */
  @media (hover: hover) { li:not(:hover):not(:focus-within) .upto { opacity: 0; } }
  .link { padding: 0; background: none; border: 0; color: var(--acc-fg); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    .size { display: none; }
    .controls { width: 100%; justify-content: space-between; gap: 6px; flex-wrap: nowrap; }
    .ghost.seek { padding: 0 8px; }
    .speed select { padding: 0 28px 0 10px; }
    .speed .icon { right: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Drive Autoplay</h1>
    <div class="tools">
      <button id="install" class="ghost" type="button" aria-label="Instalar la aplicación" title="Instalar como aplicación" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>
      </button>
      <button id="bg" class="ghost" type="button" aria-label="Elegir imagen de fondo para audios" title="Imagen de fondo para audios (se guarda solo en tu navegador)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg>
      </button>
      <button id="bgClear" class="ghost" type="button" aria-label="Quitar imagen de fondo" title="Quitar imagen de fondo" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button id="theme" class="ghost" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <p class="lede">Escucha audiolibros, podcasts o videos de una carpeta pública de Google Drive uno tras otro. Recuerda los capítulos vistos y dónde te quedaste en cada uno, aunque cierres el navegador.</p>
  <input id="bgFile" type="file" accept="image/*" hidden>

  <form id="f">
    <input id="url" type="url" placeholder="Pega la URL de una carpeta pública de Drive" aria-label="URL de la carpeta de Google Drive" autocomplete="off" required>
    <button id="go" class="primary">Cargar</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>

  <div id="app" hidden>
    <section class="stage" aria-label="Reproductor">
      <div class="media" id="media">
        <video id="player" class="audio" controls preload="metadata" playsinline></video>
      </div>
      <div class="now">
        <div class="meta">
          <p class="title" id="now"></p>
          <div class="count" id="count"></div>
        </div>
        <div class="controls">
          <button id="prev" class="ghost" type="button" aria-label="Anterior" title="Anterior">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5.5v13a.5.5 0 0 1-.8.4l-9-6.5a.5.5 0 0 1 0-.8l9-6.5a.5.5 0 0 1 .8.4Z"/></svg>
          </button>
          <button id="back10" class="ghost seek" type="button" aria-label="Retroceder 10 segundos" title="Retroceder 10 s">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 3.5v4h4"/></svg>10
          </button>
          <button id="fwd10" class="ghost seek" type="button" aria-label="Adelantar 10 segundos" title="Adelantar 10 s">
            10<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M20 3.5v4h-4"/></svg>
          </button>
          <button id="next" class="ghost" type="button" aria-label="Siguiente" title="Siguiente">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5.5v13a.5.5 0 0 0 .8.4l9-6.5a.5.5 0 0 0 0-.8l-9-6.5a.5.5 0 0 0-.8.4Z"/></svg>
          </button>
          <label class="speed">
            <select id="rate" aria-label="Velocidad de reproducción"></select>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </label>
        </div>
      </div>
    </section>
    <ol id="list" aria-label="Capítulos de la carpeta"></ol>
  </div>
</main>

<script src="/config.js"></script>
<script>
// Browser key for the Google Drive API, provided at runtime by /config.js (never committed).
// Restrict it to "Google Drive API" and to the addresses you open the app from in Google Cloud.
const API_KEY = window.DRIVE_API_KEY || "";
const SEEK_STEP = 10; // seconds for the back/forward buttons

const $ = id => document.getElementById(id);
const player = $("player"), listEl = $("list"), msg = $("msg"), rateSel = $("rate");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Theme: manual choice (saved) or, if none, the system preference.
const root = document.documentElement, themeBtn = $("theme"), sysDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : sysDark.matches;
function syncTheme() {
  const d = isDark();
  themeBtn.dataset.mode = d ? "dark" : "light";
  const text = d ? "Cambiar a modo claro" : "Cambiar a modo oscuro";
  themeBtn.setAttribute("aria-label", text); themeBtn.title = text;
  // Status bar / app window color follows the effective theme, including a manual choice.
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = d ? "#131A2C" : "#425992";
}
themeBtn.onclick = () => { const t = isDark() ? "light" : "dark"; root.dataset.theme = t; store.set("theme", t); syncTheme(); };
sysDark.addEventListener("change", syncTheme);
syncTheme();

// Background image for audio files: downscaled and stored only in this browser.
const media = $("media"), bgClear = $("bgClear"), bgFile = $("bgFile");
function applyBg(url) {
  if (url) player.poster = url; else player.removeAttribute("poster");
  media.classList.toggle("has-bg", !!url);
  bgClear.hidden = !url;
}
applyBg(store.get("bg", null));
$("bg").onclick = () => bgFile.click();
bgClear.onclick = () => { try { localStorage.removeItem("bg"); } catch {} applyBg(null); };
bgFile.onchange = async () => {
  const file = bgFile.files[0]; bgFile.value = "";
  if (!file) return;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280 / bmp.width);
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.85);
    localStorage.setItem("bg", JSON.stringify(url));
    applyBg(url);
    say("Imagen de fondo aplicada. Se verá con los audios.");
  } catch { say("No se pudo usar esa imagen. Prueba con otra (JPG, PNG o WebP).", true); }
};

let files = [], idx = -1, rate = store.get("rate", 1), folderId = null;
// Progress for every file ever played, in any folder: { t: seconds, d: duration, done: bool }.
let progress = store.get("progress", {}), rows = [];

for (const r of [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3]) rateSel.add(new Option(r + "x", r));
rateSel.value = rate;
player.defaultPlaybackRate = rate;

function say(text, err) { msg.textContent = text; msg.className = err ? "err" : ""; }

function parseFolderId(s) {
  s = s.trim();
  const m = s.match(/\/folders\/([\w-]+)/) || s.match(/[?&]id=([\w-]+)/);
  if (m) return m[1];
  return /^[\w-]{10,}$/.test(s) ? s : null;
}

const fmt = n => n ? (n / 1048576 >= 1 ? (n / 1048576).toFixed(0) + " MB" : (n / 1024).toFixed(0) + " KB") : "";
const label = name => name.replace(/\.[A-Za-z0-9]{2,5}$/, "");

// A chapter counts as watched once less than 5% (at most 30 s) remains, e.g. credits or outro.
const nearEnd = (t, d) => d > 0 && d - t <= Math.min(30, d * 0.05);
// Files are identified by content (Drive's md5Checksum), not by Drive id, so progress survives a folder
// being deleted and uploaded again. Without a checksum, name + size is the fallback.
const fileKey = f => f.md5Checksum ? "md5:" + f.md5Checksum : "ns:" + f.name + "|" + (f.size || "");
const saveProgress = () => store.set("progress", progress);
const apiUrl = f => `https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&key=${API_KEY}`;
// Same-origin media proxy provided by server.js (home server). Browsers cannot use Drive's public
// download endpoint directly (it rejects cross-site requests), and the API endpoint gets throttled.
const proxyUrl = f => `/media/${encodeURIComponent(f.id)}`;
let useProxy = true; // turned off when the app is served without server.js (static hosting)
const stateOf = f => progress[fileKey(f)];
const entry = f => progress[fileKey(f)] ||= { t: 0, d: 0, done: false };

async function listFolder(id) {
  const out = []; let token = "";
  do {
    const p = new URLSearchParams({
      q: `'${id}' in parents and trashed=false and (mimeType contains 'audio/' or mimeType contains 'video/')`,
      fields: "nextPageToken,files(id,name,size,mimeType,md5Checksum)",
      pageSize: "1000", key: API_KEY, supportsAllDrives: "true", includeItemsFromAllDrives: "true"
    });
    if (token) p.set("pageToken", token);
    const res = await fetch("https://www.googleapis.com/drive/v3/files?" + p);
    if (!res.ok) throw new Error(res.status === 404 ? "Carpeta no encontrada o no es pública." : "Error de Drive (" + res.status + "). Revisa la clave y que la carpeta sea pública.");
    const j = await res.json();
    out.push(...j.files); token = j.nextPageToken || "";
  } while (token);
  return out.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
}

const checkIcon = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/></svg>';
const checkAllIcon = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>';

function render() {
  listEl.innerHTML = "";
  rows = files.map((f, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.className = "track";
    b.innerHTML = '<span class="num"></span><span class="info"><span class="name"></span><span class="bar"><i></i></span></span><span class="size"></span>';
    b.querySelector(".num").textContent = i + 1;
    b.querySelector(".name").textContent = label(f.name);
    b.querySelector(".size").textContent = fmt(+f.size);
    b.onclick = () => play(i);
    const mark = document.createElement("button");
    mark.type = "button"; mark.className = "mark"; mark.innerHTML = checkIcon;
    mark.onclick = () => toggleDone(i);
    const upto = document.createElement("button");
    upto.type = "button"; upto.className = "upto"; upto.innerHTML = checkAllIcon;
    upto.title = "Marcar como vistos hasta aquí";
    upto.setAttribute("aria-label", "Marcar como vistos todos hasta: " + label(f.name));
    upto.onclick = () => markUpTo(i);
    li.append(b, upto, mark); listEl.append(li);
    const row = { li, track: b, bar: b.querySelector(".bar"), fill: b.querySelector(".bar i"), mark };
    updateRow(i, row);
    return row;
  });
  updateCount();
}

function updateRow(i, row = rows[i]) {
  if (!row) return;
  const p = stateOf(files[i]), done = !!p?.done, cur = i === idx;
  const pct = done ? 100 : p?.d ? Math.min(100, p.t / p.d * 100) : 0;
  row.li.classList.toggle("done", done);
  row.li.classList.toggle("current", cur);
  if (cur) row.track.setAttribute("aria-current", "true"); else row.track.removeAttribute("aria-current");
  row.bar.hidden = pct <= 0;
  row.fill.style.width = pct.toFixed(1) + "%";
  const text = done ? "Marcar como no visto" : "Marcar como visto";
  row.mark.setAttribute("aria-label", text + ": " + label(files[i].name));
  row.mark.setAttribute("aria-pressed", done);
  row.mark.title = text;
}

function updateCount() {
  if (idx < 0) return;
  const seen = files.filter(f => stateOf(f)?.done).length;
  $("count").textContent = `${idx + 1} de ${files.length} · ${seen} ${seen === 1 ? "visto" : "vistos"}`;
}

function toggleDone(i) {
  const e = entry(files[i]);
  e.done = !e.done;
  // Unmarking restarts the chapter; marking keeps the position so playback is not interrupted.
  if (!e.done) e.t = 0;
  saveProgress(); updateRow(i); updateCount();
}

// Scrolls only the list (not the page) so the row is visible.
function revealRow(li) {
  const box = listEl.getBoundingClientRect(), r = li.getBoundingClientRect();
  if (r.top < box.top) listEl.scrollTop += r.top - box.top - 4;
  else if (r.bottom > box.bottom) listEl.scrollTop += r.bottom - box.bottom + 4;
}

const refreshAll = () => { rows.forEach((_, j) => updateRow(j)); updateCount(); };

// Marks chapters 1..i (inclusive) as watched, with an undo link in the status line.
function markUpTo(i) {
  const scope = files.slice(0, i + 1);
  const before = scope.map(f => [fileKey(f), stateOf(f) ? { ...stateOf(f) } : null]);
  const changed = before.filter(([, p]) => !p?.done).length;
  if (!changed) return say("Esos capítulos ya estaban marcados como vistos.");
  for (const f of scope) entry(f).done = true;
  saveProgress(); refreshAll();
  say(`${changed} ${changed === 1 ? "capítulo marcado" : "capítulos marcados"} como ${changed === 1 ? "visto" : "vistos"}.`);
  const undo = document.createElement("button");
  undo.type = "button"; undo.className = "link"; undo.textContent = "Deshacer";
  undo.onclick = () => {
    for (const [k, p] of before) { if (p) progress[k] = p; else delete progress[k]; }
    saveProgress(); refreshAll(); say("Cambios deshechos.");
  };
  msg.append(" ", undo);
}

// Loads file i at its saved position. Only plays when autoplay=true (list click, prev/next or end of file);
// on page or folder load it is left ready and paused.
function play(i, autoplay = true) {
  if (i < 0 || i >= files.length) return;
  if (idx >= 0) savePos();
  const prev = idx;
  idx = i;
  const f = files[i], p = stateOf(f);
  player.classList.toggle("audio", !f.mimeType.startsWith("video/"));
  player.src = (useProxy ? proxyUrl : apiUrl)(f);
  player.dataset.retried = 0; lastTime = 0;
  // A watched chapter that was left at the end starts over; otherwise resume where it was left.
  player.dataset.resume = p && !nearEnd(p.t, p.d) ? p.t : 0;
  if (autoplay) player.play().catch(() => {});
  $("now").textContent = label(f.name);
  $("prev").disabled = i === 0;
  $("next").disabled = i === files.length - 1;
  store.set("last", { folder: folderId, key: fileKey(f) });
  updateRow(prev); updateRow(i); updateCount();
  if (rows[i]) revealRow(rows[i].li);
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: label(f.name) });
}

// playbackRate resets when src changes, so it is always reapplied.
player.addEventListener("loadedmetadata", () => {
  player.playbackRate = rate;
  const t = +player.dataset.resume;
  if (t > 0 && t < player.duration - 2) player.currentTime = t;
  player.dataset.resume = 0;
});
player.addEventListener("ratechange", () => {
  // Adopt speed changes made through the native controls.
  if (player.playbackRate !== rate && player.readyState > 0) setRate(player.playbackRate);
});
player.addEventListener("ended", () => {
  if (idx < 0) return;
  const e = entry(files[idx]);
  e.done = true; e.t = 0;
  saveProgress(); updateRow(idx); updateCount();
  if (idx + 1 < files.length) play(idx + 1);
});
// Remembered so a failed request can be retried at the same second and in the same play/pause state.
let lastTime = 0, wantPlay = false;
const trackTime = () => { if (!(+player.dataset.resume > 0)) lastTime = player.currentTime; };
player.addEventListener("timeupdate", trackTime);
player.addEventListener("seeking", trackTime);
player.addEventListener("play", () => { wantPlay = true; });
player.addEventListener("pause", () => { if (!player.error) wantPlay = false; });

player.addEventListener("error", async () => {
  if (!player.src || idx < 0) return;
  const f = files[idx];
  // Retry once on the other endpoint at the same position and play/pause state. Failures often happen
  // on the new range request made when resuming after a pause.
  if (player.dataset.retried !== "1") {
    const failed = player.src, fromProxy = !failed.startsWith("https://www.googleapis.com/");
    const at = +player.dataset.resume || lastTime, resume = wantPlay;
    // No server.js behind this page (e.g. static hosting): use the API for the rest of the session.
    if (fromProxy) useProxy = await fetch("/media/health").then(r => r.ok, () => false);
    if (player.src !== failed) return; // the user already moved to another file
    player.src = (fromProxy ? apiUrl : proxyUrl)(f);
    player.dataset.retried = 1;
    player.dataset.resume = at;
    if (resume) player.play().catch(() => {});
    return;
  }
  // Both endpoints failed: stay on the file, do not skip ahead or keep playing.
  const src = player.src, name = label(f.name), code = player.error?.code;
  // The media element hides the HTTP status, so probe one byte to tell the user what Drive answered.
  let detail = "";
  try {
    const r = await fetch(src, { headers: { Range: "bytes=0-0" } });
    detail = r.ok
      ? (code === 3 || code === 4 ? " (el navegador no pudo reproducir este formato)" : " (Drive respondió bien: puede ser una extensión o un fallo de red momentáneo)")
      : ` (Drive respondió ${r.status}${r.status === 403 ? ": revisa las restricciones de la API key o espera, puede ser la cuota de descargas" : ""})`;
  } catch { detail = " (Google no respondió o bloqueó un momento las descargas desde tu red; espera unos minutos)"; }
  if (player.src !== src) return; // the user already moved to another file
  say(`No se pudo cargar «${name}»${detail}. Toca el capítulo para reintentar.`, true);
});

let lastSave = 0;
function savePos() {
  // Skip while a resume is pending: currentTime is still 0 and would overwrite the saved position.
  if (idx < 0 || +player.dataset.resume > 0 || !player.duration) return;
  lastSave = Date.now();
  const e = entry(files[idx]);
  e.t = player.currentTime; e.d = player.duration;
  if (!e.done && nearEnd(e.t, e.d)) { e.done = true; updateCount(); }
  saveProgress(); updateRow(idx);
}
player.addEventListener("timeupdate", () => { if (Date.now() - lastSave >= 5000) savePos(); });
player.addEventListener("pause", savePos);
player.addEventListener("seeked", savePos);
// Save when the tab is hidden or the browser is closed.
addEventListener("pagehide", savePos);
document.addEventListener("visibilitychange", () => { if (document.hidden) savePos(); });

function seek(delta) {
  if (!player.duration) return;
  player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + delta));
}

function setRate(r) {
  rate = r; store.set("rate", r);
  rateSel.value = r;
  player.defaultPlaybackRate = r;
  if (player.playbackRate !== r) player.playbackRate = r;
}
rateSel.onchange = () => setRate(+rateSel.value);
$("prev").onclick = () => play(idx - 1);
$("next").onclick = () => play(idx + 1);
$("back10").onclick = () => seek(-SEEK_STEP);
$("fwd10").onclick = () => seek(SEEK_STEP);

// Lock screen / headset controls.
if ("mediaSession" in navigator) {
  const handlers = {
    previoustrack: () => play(idx - 1),
    nexttrack: () => play(idx + 1),
    seekbackward: d => seek(-(d.seekOffset || SEEK_STEP)),
    seekforward: d => seek(d.seekOffset || SEEK_STEP)
  };
  for (const [action, fn] of Object.entries(handlers)) {
    try { navigator.mediaSession.setActionHandler(action, fn); } catch {}
  }
}

async function load(id, resumeKey) {
  say("Cargando carpeta…");
  $("go").disabled = true;
  $("app").hidden = true;
  try {
    folderId = id;
    progress = store.get("progress", {}); // may have changed in another tab
    files = await listFolder(id);
    if (!files.length) { say("La carpeta no contiene archivos de audio o video (o no es pública).", true); return; }
    say(files.length + (files.length === 1 ? " archivo" : " archivos") + " en la carpeta.");
    store.set("folder", id);
    try { history.replaceState(null, "", "?folder=" + id); } catch {} // shareable link
    $("app").hidden = false;
    idx = -1; render();
    // Resume the last chapter of this folder; otherwise (new or re-uploaded folder) the first unwatched one.
    let i = resumeKey ? files.findIndex(f => fileKey(f) === resumeKey) : -1;
    if (i < 0) i = Math.max(0, files.findIndex(f => !stateOf(f)?.done));
    play(i, false);
  } catch (e) { say(e.message || "No se pudo cargar la carpeta.", true); }
  finally { $("go").disabled = false; }
}

const lastFileIn = id => { const last = store.get("last", null); return last && last.folder === id ? last.key : null; };

$("f").onsubmit = e => {
  e.preventDefault();
  const id = parseFolderId($("url").value);
  if (!id) return say("No reconozco la URL de la carpeta.", true);
  if (idx >= 0) savePos();
  load(id, lastFileIn(id));
};

if (!API_KEY) say("Falta configurar la API key: define DRIVE_API_KEY en el servidor (o crea config.js).", true);
else {
  // ?folder=<folder URL or ID> takes precedence over the last saved folder.
  const param = new URLSearchParams(location.search).get("folder");
  const fromParam = param ? parseFolderId(param) : null;
  const id = fromParam || store.get("folder", null);
  if (param && !fromParam) say("El parámetro «folder» de la URL no es una carpeta de Drive válida.", true);
  if (id) {
    $("url").value = "https://drive.google.com/drive/folders/" + id;
    load(id, lastFileIn(id));
  }
}

// PWA: installable app shell.
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}

// Own install button (Chrome/Edge, Android and desktop). Hidden when already running as an installed app.
const installBtn = $("install");
let installPrompt = null;
addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  installBtn.hidden = false;
});
installBtn.onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice.catch(() => {});
  installPrompt = null;
  installBtn.hidden = true;
};
addEventListener("appinstalled", () => { installPrompt = null; installBtn.hidden = true; });
</script>
</body>
</html>
