# Portainer stack: Stacks -> Add stack -> paste this, then set DRIVE_API_KEY under "Environment variables".
services:
  drive-autoplay:
    image: ghcr.io/byronsliger/drive-autoplay:latest
    container_name: drive-autoplay
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DRIVE_API_KEY: ${DRIVE_API_KEY}
    # Hardening: the app writes nothing to disk and needs no Linux capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
